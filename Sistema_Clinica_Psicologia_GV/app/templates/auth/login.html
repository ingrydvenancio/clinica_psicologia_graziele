{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <div class="text-center mb-3">
                <img src="{{ url_for('static', filename='img/logo_gv.png') }}" alt="Logo" height="85">
                <h4 class="fw-bold text-gv-primary mt-2">Acesso ao Sistema</h4>
                <p class="text-muted small">Administradores, Recepcionistas e Psicólogos</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">E-mail</label>
                    <input type="email" name="email" class="form-control" required placeholder="usuario@clinica.com.br">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Senha</label>
                    <input type="password" name="senha" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-gv-primary w-100 py-2 fw-bold">Entrar</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('public.recuperar_senha') }}" class="small text-decoration-none">Esqueci minha senha</a>
            </div>
            <div class="alert alert-light border mt-3 small mb-0">
                <strong>Contas Padrão de Demonstração:</strong><br>
                Admin: <code>admin@clinica.com</code> / <code>admin123</code><br>
                Psicóloga: <code>graziele@clinica.com</code> / <code>psi123</code><br>
                Recepção: <code>recepcao@clinica.com</code> / <code>rec123</code>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h4 class="fw-bold text-gv-primary mb-3">Recuperação de Senha</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">E-mail cadastrado</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nova Senha (mínimo 6 caracteres)</label>
                    <input type="password" name="nova_senha" class="form-control" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-gv-primary w-100">Redefinir Senha</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
